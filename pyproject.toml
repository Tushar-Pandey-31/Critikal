[tool.poetry]
name = "critikal"
version = "0.1.0"
description = "Critikal: autonomous smart contract security research agent"
authors = ["Tushar Pandey <pandeytushar359@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "src" }]

[tool.poetry.scripts]
critikal = "src.cli:main"

[tool.poetry.dependencies]
python = ">=3.12.1,<3.13"
ipython = "^8.18"

# Security tooling
slither-analyzer = "0.10.3"
networkx = "3.2.1"

# Vector DB
chromadb = "^0.6.0"
langchain-chroma = "0.2.3"

# LangChain ecosystem (all 0.3.x family)
langchain = "^0.3.0"
langchain-core = "^0.3.0"
langchain-community = "^0.3.0"
langchain-huggingface = "^0.1.0"
langchain-google-genai = "^2.1.0"
langchain-anthropic = ">=0.3.0"
langchain-openai = ">=0.2.0"
langgraph = "^0.3.0"

# Embeddings
sentence-transformers = "^3.0.0"

# HTTP / config / CLI UX
requests = "^2.32.0"
PyYAML = "^6.0.1"
rich = ">=13.7.0,<15.0.0"

# TUI (default interactive mode)
textual = { version = ">=8.2.3,<9.0.0", extras = ["syntax"] }

# Utilities
pypdf = "^4.0.0"
python-dotenv = "1.0.1"
apscheduler = "^3.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.2,<10.0.0"
pytest-asyncio = ">=1.3.0,<2.0.0"
pytest-timeout = ">=2.3.0,<3.0.0"
ruff = ">=0.8.0,<1.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default per-test wall clock so a hung test (e.g. one that accidentally
# reaches the network) can't stall CI. pytest-timeout is in dev deps.
timeout = 60
asyncio_mode = "auto"
markers = [
    "integration: tests that require real LLM/network access (skipped in CI)",
    "uses_rag: tests that exercise the real RAG module (loads chromadb)",
]
# Don't walk into cloned target repos or build artifacts — they ship their own
# pytest suites (solady/wake etc.) that pull in deps we don't carry.
norecursedirs = [
    "data",
    "data/scratch",
    "benchmarks",
    "proven_exploits",
    ".venv",
    "dist",
    "build",
    "node_modules",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B905",   # zip-without-strict — not critical
    "SIM108", # ternary — readability preference
    "RUF012", # mutable class default — too noisy for dataclasses
    # Stylistic rules left for a follow-up cleanup PR; not bug-class.
    "E402",   # late imports — used for telemetry-silence patches and conditional legacy imports
    "E701",   # multi-statement-on-one-line — occasional `if x: continue`
    "E712",   # x == True/False — intentional in test assertion strings for readability
    "E741",   # ambiguous var names (l, I, O) — slither/graph code uses these conventionally
    "B007",   # unused loop counter — often kept for tuple unpacking clarity
    "F841",   # unused locals — flagged but mostly require domain review (see scoring/vulnerability_detection)
    "SIM102", # collapsible if — refactor preference
    "SIM103", # needless bool
    "SIM105", # suppressible exception — readability preference
    "SIM110", # reimplemented builtin
    "SIM115", # open without context manager — file held for object lifetime
    "RUF001", # ambiguous unicode in strings — box-drawing chars used in terminal output
    "RUF002", # ambiguous unicode in docstrings — em-dashes intentional
    "RUF003", # ambiguous unicode in comments — em-dashes intentional
    "RUF005", # collection-literal-concatenation
    "RUF013", # implicit-optional — would require sweeping type-hint changes
    "RUF015", # unnecessary first-element iteration
    "RUF034", # useless if-else
    "RUF046", # unnecessary cast to int
    "RUF059", # unused unpacked variable
    "UP042",  # str-enum migration — separable refactor
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
